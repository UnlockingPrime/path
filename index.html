<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Path</title>
<meta name="description" content="Daily notes, my placement path, career options and company tracker, in one place.">
<meta name="theme-color" content="#FFF4E6">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Path">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --text: #2b2540;
    --muted: #7a6f8f;
    --faint: #b9b0c9;
    --surface: #ffffff;
    --line: #efe7f7;
    --violet: #7950f2;
    --pink: #f06595;
    --warn: #e8590c;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    background: #fff8f0 linear-gradient(160deg, #fff4e6 0%, #fdf0ff 45%, #e6fcf5 100%) fixed;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: calc(40px + env(safe-area-inset-top)) 16px calc(64px + env(safe-area-inset-bottom));
  }

  textarea, input {
    width: 100%;
    border: 0;
    outline: none;
    background: transparent;
    color: inherit;
    font: inherit;
    padding: 0;
    resize: none;
  }
  textarea { overflow: hidden; display: block; }
  ::placeholder { color: var(--faint); }
  button {
    font: inherit;
    color: var(--muted);
    background: none;
    border: 0;
    cursor: pointer;
    padding: 0;
  }
  button:hover { color: var(--violet); }

  /* Goal */
  .goal-card {
    background: linear-gradient(135deg, #ffd8a8 0%, #fcc2d7 50%, #d0bfff 100%);
    border-radius: 20px;
    padding: 20px 22px;
    box-shadow: 0 10px 30px rgba(240, 101, 149, .18);
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #6b3a5c;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .goal { font-size: 24px; font-weight: 700; line-height: 1.3; letter-spacing: -.01em; color: #3b1f4a; }
  .stats { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    font-size: 13px;
    padding: 4px 12px;
    border-radius: 999px;
    font-weight: 500;
  }
  .pill b { font-weight: 700; }
  .p-day { background: #fff0db; color: #d9480f; }
  .p-streak { background: #ffe3ee; color: #a61e4d; }
  .p-written { background: #e3f9e5; color: #2b8a3e; }

  /* Tabs */
  nav {
    display: flex;
    gap: 6px;
    margin: 28px 0 24px;
    padding: 5px;
    background: rgba(255, 255, 255, .7);
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(121, 80, 242, .08);
  }
  nav button {
    flex: 1;
    padding: 8px 0;
    border-radius: 999px;
    font-weight: 600;
    transition: background .2s, color .2s;
  }
  nav button.active {
    color: #fff;
    background: linear-gradient(135deg, var(--violet), var(--pink));
    box-shadow: 0 4px 12px rgba(121, 80, 242, .3);
  }
  section[hidden] { display: none; }

  /* Notes */
  .today {
    background: var(--surface);
    border: 2px solid #ffe066;
    border-radius: 18px;
    padding: 16px 18px;
    box-shadow: 0 8px 24px rgba(252, 196, 25, .18);
    transition: border-color .2s;
  }
  .today:focus-within { border-color: var(--violet); }
  .today-label { font-size: 14px; font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; color: #e67700; }
  .today-label span { color: var(--muted); font-weight: 500; }
  #today { min-height: 160px; }
  h2 {
    font-size: 13px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--violet);
    font-weight: 700;
    margin: 40px 0 10px;
  }
  .day {
    background: rgba(255, 255, 255, .75);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 8px;
    border-left: 4px solid var(--c, var(--violet));
  }
  .day-head { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
  .day-head .date { font-weight: 700; color: var(--i, var(--text)); }
  .day-head .num { color: var(--muted); }
  .day.missed { background: rgba(255, 255, 255, .4); border-left-color: var(--faint); }
  .day.missed .date { color: var(--faint); font-weight: 500; }
  .empty { color: var(--muted); font-size: 15px; padding: 14px 4px; }

  /* Cards */
  .hint { font-size: 13px; color: var(--muted); margin: 0 0 16px; }
  .card {
    background: var(--surface);
    border-radius: 18px;
    padding: 16px 18px;
    margin-bottom: 14px;
    border-left: 6px solid var(--c);
    box-shadow: 0 6px 20px rgba(43, 37, 64, .06);
    transition: box-shadow .2s, transform .2s;
  }
  .card:focus-within { box-shadow: 0 8px 26px rgba(121, 80, 242, .18); }
  .card-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 8px; }
  .card-titles { flex: 1; min-width: 0; }
  .card-title { font-size: 17px; font-weight: 700; }
  .card-meta {
    display: inline-block;
    width: auto;
    max-width: 100%;
    margin-top: 4px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--i);
    background: var(--t);
    padding: 2px 10px;
    border-radius: 999px;
  }
  .card-actions { display: flex; gap: 10px; font-size: 14px; opacity: .4; }
  .card:hover .card-actions, .card:focus-within .card-actions { opacity: 1; }
  @media (hover: none) { .card-actions { opacity: 1; } }
  .card-body { font-size: 15px; }
  .row-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 14px; }
  .add {
    color: #fff;
    font-weight: 600;
    background: linear-gradient(135deg, #20c997, #51cf66);
    padding: 7px 16px;
    border-radius: 999px;
    box-shadow: 0 4px 12px rgba(32, 201, 151, .3);
  }
  .add:hover { color: #fff; filter: brightness(1.05); }

  /* Footer */
  footer {
    margin-top: 56px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--muted);
  }
  footer button {
    background: rgba(255, 255, 255, .8);
    padding: 6px 14px;
    border-radius: 999px;
    color: #1864ab;
    font-weight: 500;
  }
  footer .backup-age { margin-left: auto; }
  footer .backup-age.old { color: var(--warn); font-weight: 600; }
  .toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--violet), var(--pink));
    border-radius: 999px;
    padding: 5px 14px;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* Install pop-up (browser only) */
  .ipop {
    position: fixed;
    inset: 0;
    z-index: 90;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px);
    background: rgba(43, 37, 64, .3);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
  }
  .ipop.open { opacity: 1; pointer-events: auto; }
  .ipcard {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border-radius: 22px;
    padding: 18px;
    box-shadow: 0 24px 48px -20px rgba(121, 80, 242, .45);
    transform: translateY(24px);
    transition: transform .35s;
  }
  .ipop.open .ipcard { transform: none; }
  .iphead { display: flex; align-items: center; gap: 13px; }
  .iphead img { width: 52px; height: 52px; border-radius: 13px; flex-shrink: 0; }
  .ipt { font-size: 17px; font-weight: 700; }
  .ips { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
  .ipdots { display: flex; gap: 5px; margin: 14px 0 14px 2px; }
  .ipdots i { width: 22px; height: 4px; border-radius: 99px; }
  .ipbtns { display: flex; gap: 9px; }
  .ipbtns button { flex: 1; padding: 10px 0; border-radius: 999px; font-weight: 600; }
  #ipNo { background: #f3effa; color: var(--muted); }
  #ipYes { color: #fff; background: linear-gradient(135deg, var(--violet), var(--pink)); box-shadow: 0 4px 12px rgba(121, 80, 242, .3); }
  @media (min-width: 720px) { .ipop { align-items: center; } }

  /* Companies */
  nav button { font-size: 15px; min-width: 0; white-space: nowrap; }
  @media (max-width: 420px) {
    nav { gap: 2px; padding: 4px; }
    nav button { font-size: 13.5px; letter-spacing: -.01em; }
  }
  .muted { color: var(--muted); }
  .co-stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .p-co { background: #efe9ff; color: #5f3dc4; }
  .p-offer { background: #e3f9e5; color: #2b8a3e; }
  .p-out { background: #ffe3e3; color: #c92a2a; }
  .upc {
    background: var(--surface);
    border: 2px solid #ffe066;
    border-radius: 18px;
    padding: 14px 16px 10px;
    margin-bottom: 18px;
    box-shadow: 0 8px 24px rgba(252, 196, 25, .18);
  }
  .upc[hidden] { display: none; }
  .upc-h { font-size: 14px; font-weight: 700; color: #e67700; margin-bottom: 4px; }
  .upc-row {
    display: flex;
    gap: 12px;
    width: 100%;
    text-align: left;
    color: var(--text);
    padding: 8px 0;
    border-top: 1px solid var(--line);
    font-size: 15px;
  }
  .upc-row:first-of-type { border-top: 0; }
  .upc-when { flex: 0 0 104px; font-weight: 700; line-height: 1.3; }
  .upc-when small { display: block; font-weight: 500; color: var(--muted); font-size: 12.5px; }
  .upc-what { flex: 1; min-width: 0; line-height: 1.35; }
  .upc-what small { display: block; color: var(--muted); font-size: 13px; }
  .upc-wait { font-size: 13.5px; color: var(--muted); padding: 8px 0 4px; border-top: 1px solid var(--line); }
  .upc-wait button { color: #5f3dc4; background: #efe9ff; border-radius: 999px; padding: 1px 9px; margin: 3px 2px 0 0; font-size: 13px; font-weight: 600; }
  .soon { color: #d9480f; font-weight: 600; }
  .late { color: #c92a2a; font-weight: 600; }
  .co-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .co-bar .add { flex-shrink: 0; }
  #coSearch {
    flex: 1;
    min-width: 0;
    background: rgba(255, 255, 255, .8);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 15px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chips button {
    font-size: 13.5px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .7);
  }
  .chips button.on, .chips button.on:hover { color: #fff; background: var(--violet); }
  .co { padding: 0; }
  .co.out { opacity: .6; }
  .co.out:focus-within, .co.out.open { opacity: 1; }
  .co-summary { padding: 14px 16px; cursor: pointer; outline: none; }
  .co-summary:focus-visible { box-shadow: inset 0 0 0 2px var(--violet); border-radius: 12px; }
  .co-top { display: flex; align-items: center; gap: 8px; }
  .co-name { font-size: 17px; font-weight: 700; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .badge { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .chev { color: var(--faint); transition: transform .2s; }
  .co.open .chev { transform: rotate(180deg); }
  .co-sub { font-size: 13.5px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
  .co-prog { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 8px; font-size: 13px; }
  .dots { display: flex; gap: 4px; }
  .dots i { width: 18px; height: 6px; border-radius: 99px; background: var(--line); }
  .dots i.d { background: #51cf66; }
  .dots i.n { background: #ffd43b; }
  .dots i.x { background: #ff6b6b; }
  .co-next { font-size: 14px; margin-top: 6px; }
  .co-edit { border-top: 1px dashed var(--line); padding: 14px 16px 16px; }
  .co-edit input:not([type=checkbox]), .co-edit textarea {
    background: #faf7ff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 7px 10px;
    font-size: 15px;
  }
  .co-edit input:focus, .co-edit textarea:focus { border-color: #b197fc; }
  .co-edit input[type=date], .co-edit input[type=datetime-local] { display: block; min-height: 38px; }
  .co-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .fld { display: block; min-width: 0; }
  .fld.wide { grid-column: 1 / -1; }
  .fld-l { display: block; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .03em; margin-bottom: 4px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { font-size: 14px; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: #f3effa; }
  .seg button.on, .seg button.on:hover { color: #fff; background: var(--violet); }
  .rnd-h { margin-top: 16px; }
  .rnd {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    gap: 6px 8px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .rnd input[type=checkbox] { width: 20px; height: 20px; margin: 0; accent-color: #2b8a3e; }
  .rnd.done .rnd-name { text-decoration: line-through; color: var(--muted); }
  .rnd-acts { display: flex; gap: 10px; font-size: 14px; }
  .rnd-when { grid-column: 2 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .rnd-when input { flex: 1 1 200px; width: auto; }
  .rnd-when small { font-size: 12.5px; color: var(--muted); }
  .rnd-adds { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
  .rnd-adds button { font-size: 13px; font-weight: 600; color: #087f5b; background: #dcfaf0; padding: 4px 10px; border-radius: 999px; }
  .co-del { margin-top: 14px; font-size: 14px; color: #c92a2a; }
</style>
</head>
<body>
<div class="wrap">
  <header class="goal-card">
    <div class="eyebrow">✨ My goal</div>
    <textarea id="goal" class="goal" rows="1" placeholder="Write your goal…"></textarea>
    <div class="stats" id="stats"></div>
  </header>

  <nav>
    <button data-tab="notes">Notes</button>
    <button data-tab="path">Path</button>
    <button data-tab="careers">Careers</button>
    <button data-tab="companies">Companies</button>
  </nav>

  <section id="tab-notes">
    <div class="today">
      <div class="today-label"><div id="todayDate"></div><span id="todayNum"></span></div>
      <textarea id="today" placeholder="What did you really do today?"></textarea>
    </div>
    <h2>Previous days</h2>
    <div id="history"></div>
  </section>

  <section id="tab-path" hidden>
    <p class="hint">Click any text to edit. One step per line.</p>
    <div id="pathList"></div>
    <div class="row-actions">
      <button class="add" data-add="path">+ Add phase</button>
      <button data-reset="path">Reset to suggested</button>
    </div>
  </section>

  <section id="tab-careers" hidden>
    <p class="hint">Career options for you and the path for each. Click any text to edit.</p>
    <div id="careersList"></div>
    <div class="row-actions">
      <button class="add" data-add="careers">+ Add option</button>
      <button data-reset="careers">Reset to suggested</button>
    </div>
  </section>

  <section id="tab-companies" hidden>
    <div class="co-stats" id="coStats"></div>
    <div class="upc" id="coUpcoming" hidden></div>
    <div class="co-bar">
      <button class="add" id="addCo">+ Add company</button>
      <input id="coSearch" type="search" placeholder="Search name, role, job code…" aria-label="Search companies">
    </div>
    <div class="chips" id="coFilters">
      <button data-f="all">All</button>
      <button data-f="active">In process</button>
      <button data-f="high">High priority</button>
      <button data-f="offer">Offers</button>
      <button data-f="out">Disqualified</button>
    </div>
    <div id="coList"></div>
  </section>

  <footer>
    <button id="exportBtn">Export backup</button>
    <button id="importBtn">Import backup</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <span class="backup-age" id="backupAge"></span>
  </footer>
</div>
<div class="toast" id="toast"></div>

<div class="ipop" id="ipop" role="dialog" aria-modal="true" aria-labelledby="ipT" hidden>
  <div class="ipcard">
    <div class="iphead">
      <img src="icons/icon-192.png" alt="">
      <div>
        <div class="ipt" id="ipT">Install My Path</div>
        <div class="ips">Get it on your home screen. Opens like an app and works offline.</div>
      </div>
    </div>
    <div class="ipdots" aria-hidden="true">
      <i style="background:#ff922b"></i><i style="background:#f06595"></i><i style="background:#9775fa"></i><i style="background:#20c997"></i>
    </div>
    <div class="ipbtns">
      <button id="ipNo">Not now</button>
      <button id="ipYes">Install</button>
    </div>
  </div>
</div>

<script>
const KEY = 'my-path-v1';
const TAB_KEY = 'my-path-tab';

const DEFAULT_GOAL = 'Get a software (or analyst) job by April 2027 — and pass every course this semester.';

const DEFAULT_PATH = [
  { title: 'Daily minimum', meta: 'Every day — no zero days', body:
`- 1 DSA problem
- 10 flashcards (Anki)
- Write today's note here` },
  { title: 'Now → Nov 10', meta: '60% semester · 40% placement', body:
`- Fix resume this week, get 2 seniors to review it
- Give every OA that comes
- 2–3 DSA problems a day from the core patterns
- 30 min SQL a day
- Start the 5 key courses` },
  { title: 'Nov 11–21 · Endsem', meta: '90% semester', body:
`- Exams first — do not fail any course
- Only 1 easy problem + 10 flashcards a day
- No new topics` },
  { title: 'Nov 22 → Phase 1', meta: '100% placement · 10–12 hrs a day', body:
`- Medium problems in the core patterns
- Revise OS, DBMS, CN, OOPs (revise, don't relearn)
- Project explanation ready: 2-minute version + deep dive
- HR answers: tell me about yourself, why low CPI, why this company
- 3–4 mock interviews with friends
- Read IITB interview experiences for each shortlisted company` },
  { title: 'December · Phase 1', meta: 'Interviews', body:
`- Give everything in each interview
- After each interview, write the questions asked in today's note` },
  { title: 'Jan → April · Phase 2 + off-campus', meta: '5–6 hrs a day + courses', body:
`- Keep doing DSA mediums, re-solve old ones
- Ship one deployed project with a live link
- Every week: 10 alumni referral requests, 15–20 applications, 5 founder emails
- Apply to both SDE and Analyst roles` },
  { title: 'DSA method', meta: 'So you stop forgetting', body:
`- Patterns: arrays & hashing, two pointers, sliding window, binary search, stack, linked list, trees, heap, graphs (BFS/DFS, topo sort), basic DP, backtracking, intervals & greedy
- One list only: NeetCode 150 (Blind-75 subset first)
- After each problem, write one key-idea line
- Re-solve after 3 days and after 7 days
- Stuck 20 min → read solution → solve it yourself next day
- Target: 80–100 well-revised problems by mid-December` },
  { title: 'Small gaps', meta: 'Your JEE trick, upgraded', body:
`- Anki in queues, on walks, before lectures
- Sticky notes on the mirror: 3 SQL queries or OS concepts, change every Sunday
- Lock screen: one pattern template, change weekly
- Before sleep: dry-run one problem in your head
- While walking: answer interview questions out loud
- LeetCode + Anki where Instagram / YouTube used to be` },
  { title: 'Staying consistent', meta: 'Rules', body:
`- A minimum day beats a zero day
- Same time slot every day
- Rejections are normal — count interviews given as wins
- Check placement groups twice a day, not 50 times
- Sleep 7 hrs, walk 20 min
- One accountability friend` },
];

const DEFAULT_CAREERS = [
  { title: 'Software Engineer (SDE)', meta: 'Main target', body:
`Why: CSE from IIT Bombay; most openings on and off campus.

Interviews test:
- DSA (easy–medium)
- CS fundamentals: OS, DBMS, CN, OOPs
- Your project, in depth

Path:
- Follow the DSA method in the Path tab
- Revise OS / DBMS / CN / OOPs with Anki
- One project you can explain deeply (your timetable / endsem app counts)
- Apply: campus Phase 1 & 2, LinkedIn referrals, company career pages
- Target: product startups, mid-size product companies, companies with no / low CPI cutoff` },
  { title: 'Data / Business Analyst', meta: 'Second target', body:
`Why: little or no hard DSA, prep in weeks, overlaps with SDE prep (SQL, Python).

Interviews test:
- SQL: joins, group by, window functions
- Excel: pivot tables, lookups
- Basic stats: mean / median, probability, A/B testing idea
- Puzzles and guesstimates

Path (light SQL now, rest after endsem):
- Week 1–2: SQL — LeetCode SQL 50 / HackerRank SQL
- Week 2–3: Excel pivots + one small dashboard
- Week 3: stats basics + 1 guesstimate a day
- One analysis project: public dataset → 3 questions → short write-up of findings
- Apply to "Analyst" roles on campus and off campus` },
  { title: 'SDET / QA Engineer', meta: 'Apply when you see it', body:

// Card colours: c = stripe, t = tint, i = ink
const PALETTE = [
  { c: '#ff6b6b', t: '#ffe3e3', i: '#c92a2a' },
  { c: '#ff922b', t: '#fff0db', i: '#d9480f' },
  { c: '#fcc419', t: '#fff7d1', i: '#946c00' },
  { c: '#51cf66', t: '#e3f9e5', i: '#2b8a3e' },
  { c: '#20c997', t: '#dcfaf0', i: '#087f5b' },
  { c: '#4dabf7', t: '#e0f0ff', i: '#1864ab' },
  { c: '#9775fa', t: '#efe9ff', i: '#5f3dc4' },
  { c: '#f06595', t: '#ffe3ee', i: '#a61e4d' },
];
function paint(el, i) {
  const p = PALETTE[i % PALETTE.length];
  el.style.setProperty('--c', p.c);
  el.style.setProperty('--t', p.t);
  el.style.setProperty('--i', p.i);
}

// Companies: priority colours, application status, ready-made round names
const PRIORITY = {
  high: { label: 'High', c: '#ff6b6b', t: '#ffe3e3', i: '#c92a2a' },
  med: { label: 'Medium', c: '#ff922b', t: '#fff0db', i: '#d9480f' },
  low: { label: 'Low', c: '#4dabf7', t: '#e0f0ff', i: '#1864ab' },
};
const STATUS = {
  wish: { label: 'Not applied yet', short: 'Not applied', t: '#f1f3f5', i: '#495057' },
  applied: { label: 'In process', short: 'Applied', t: '#efe9ff', i: '#5f3dc4' },
  out: { label: 'Disqualified', short: 'Disqualified', t: '#ffe3e3', i: '#c92a2a' },
  offer: { label: 'Offer 🎉', short: 'Offer', t: '#e3f9e5', i: '#2b8a3e' },
};
const ROUND_PRESETS = ['OA', 'Technical interview', 'Personal interview', 'HR interview', 'Group discussion'];
const GROUP = { applied: 0, offer: 1, wish: 2, out: 3 };
const RANK = { high: 0, med: 1, low: 2 };

const uid = () => Math.random().toString(36).slice(2, 9);
const str = v => (typeof v === 'string' ? v : '');
function normCompany(c) {
  c = c && typeof c === 'object' ? c : {};
  return {
    id: str(c.id) || uid(),
    name: str(c.name),
    role: str(c.role),
    code: str(c.code),
    priority: PRIORITY[c.priority] ? c.priority : 'med',
    status: STATUS[c.status] ? c.status : 'applied',
    appliedOn: str(c.appliedOn),
    rounds: (Array.isArray(c.rounds) ? c.rounds : []).map(r => ({
      id: str(r && r.id) || uid(),
      name: str(r && r.name),
      at: str(r && r.at),
      done: !!(r && r.done),
    })),
    notes: str(c.notes),
  };
}
const withIds = list => list.map(c => ({ id: uid(), ...c }));

function dayKey(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function parseKey(k) {
  const [y, m, d] = k.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function daysBetween(a, b) {
  return Math.round((parseKey(b) - parseKey(a)) / 86400000);
}
function shiftKey(k, n) {
  const d = parseKey(k);
  d.setDate(d.getDate() + n);
  return dayKey(d);
}
function prettyDate(k) {
  return parseKey(k).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}

function normalize(s) {
  s = s && typeof s === 'object' ? s : {};
  const out = {
    goal: typeof s.goal === 'string' ? s.goal : DEFAULT_GOAL,
    start: typeof s.start === 'string' ? s.start : dayKey(),
    notes: s.notes && typeof s.notes === 'object' ? s.notes : {},
    path: Array.isArray(s.path) ? s.path : withIds(DEFAULT_PATH),
    careers: Array.isArray(s.careers) ? s.careers : withIds(DEFAULT_CAREERS),
    companies: Array.isArray(s.companies) ? s.companies.map(normCompany) : [],
    lastBackup: s.lastBackup || null,
  };
  // The journey starts at the earliest note, so imported notes always show up
  for (const k of Object.keys(out.notes)) if (k < out.start) out.start = k;
  return out;
}

function load() {
  try { return normalize(JSON.parse(localStorage.getItem(KEY))); }
  catch { return normalize(null); }
}

let state = load();
let currentDay = dayKey();
let saveTimer;

function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 300);
}
function saveNow() {
  clearTimeout(saveTimer);
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    toast('Saved');
  } catch {
    toast('Could not save — export a backup');
  }
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 900);
}

function autosize(t) {
  t.style.height = 'auto';
  t.style.height = t.scrollHeight + 'px';
}
function sizeAll(root = document) {
  root.querySelectorAll('textarea').forEach(autosize);
}
function bindArea(t, onInput) {
  t.addEventListener('input', () => { autosize(t); onInput(t.value); save(); });
}

function setNote(k, text) {
  if (text.trim()) state.notes[k] = text;
  else delete state.notes[k];
}

/* ---------- Stats ---------- */
function renderStats() {
  const today = currentDay;
  const dayNum = daysBetween(state.start, today) + 1;
  const written = Object.keys(state.notes).length;
  let streak = 0;
  let k = state.notes[today] ? today : shiftKey(today, -1);
  while (state.notes[k]) { streak++; k = shiftKey(k, -1); }
  document.getElementById('stats').innerHTML =
    `<span class="pill p-day">📅 Day <b>${dayNum}</b></span>` +
    `<span class="pill p-streak">🔥 Streak <b>${streak}</b></span>` +
    `<span class="pill p-written">✍️ <b>${written}</b> ${written === 1 ? 'day' : 'days'} written</span>`;
  document.getElementById('todayNum').textContent = `Day ${dayNum}`;
}

/* ---------- Notes ---------- */
function renderNotes() {
  document.getElementById('todayDate').textContent = 'Today · ' + prettyDate(currentDay);
  const todayArea = document.getElementById('today');
  todayArea.value = state.notes[currentDay] || '';

  const hist = document.getElementById('history');
  hist.replaceChildren();
  const days = daysBetween(state.start, currentDay);
  if (days <= 0) {
    const p = document.createElement('div');
    p.className = 'empty';
    p.textContent = 'Your previous days will show up here.';
    hist.append(p);
    return;
  }
  for (let i = 1; i <= days; i++) {
    const k = shiftKey(currentDay, -i);
    const text = state.notes[k] || '';
    const row = document.createElement('div');
    row.className = 'day' + (text ? '' : ' missed');
    paint(row, i - 1);
    const head = document.createElement('div');
    head.className = 'day-head';
    const date = document.createElement('span');
    date.className = 'date';
    date.textContent = prettyDate(k);
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = 'Day ' + (daysBetween(state.start, k) + 1);
    head.append(date, num);
    const t = document.createElement('textarea');
    t.rows = 1;
    t.placeholder = 'No note this day';
    t.value = text;
    bindArea(t, v => {
      setNote(k, v);
      row.classList.toggle('missed', !v.trim());
      renderStats();
    });
    row.append(head, t);
    hist.append(row);
  }
}

/* ---------- Cards (Path + Careers) ---------- */
function renderCards(name) {
  const list = state[name];
  const box = document.getElementById(name + 'List');
  box.replaceChildren();
  list.forEach((item, i) => {
    const card = document.createElement('article');
    card.className = 'card';
    paint(card, i);

    const head = document.createElement('div');
    head.className = 'card-head';
    const titles = document.createElement('div');
    titles.className = 'card-titles';
    const title = document.createElement('input');
    title.className = 'card-title';
    title.placeholder = 'Title';
    title.value = item.title;
    title.addEventListener('input', () => { item.title = title.value; save(); });
    const meta = document.createElement('input');
    meta.className = 'card-meta';
    meta.placeholder = name === 'path' ? 'When / focus' : 'Tag';
    meta.value = item.meta;
    const fitMeta = () => { meta.size = Math.max(meta.value.length, meta.placeholder.length, 4); };
    fitMeta();
    meta.addEventListener('input', () => { item.meta = meta.value; fitMeta(); save(); });
    titles.append(title, meta);

    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const up = button('↑', 'Move up', () => move(name, i, -1));
    const down = button('↓', 'Move down', () => move(name, i, 1));
    const del = button('✕', 'Remove', () => {
      if (!confirm(`Remove "${item.title || 'this card'}"?`)) return;
      list.splice(i, 1);
      saveNow();
      renderCards(name);
    });
    if (i === 0) up.style.visibility = 'hidden';
    if (i === list.length - 1) down.style.visibility = 'hidden';
    actions.append(up, down, del);
    head.append(titles, actions);

    const body = document.createElement('textarea');
    body.className = 'card-body';
    body.rows = 2;
    body.placeholder = 'Steps, one per line…';
    body.value = item.body;
    bindArea(body, v => { item.body = v; });

    card.append(head, body);
    box.append(card);
  });
  sizeAll(box);
}

function button(label, title, onClick) {
  const b = document.createElement('button');
  b.textContent = label;
  b.title = title;
  b.setAttribute('aria-label', title);
  b.addEventListener('click', onClick);
  return b;
}

function move(name, i, dir) {
  const list = state[name];
  [list[i], list[i + dir]] = [list[i + dir], list[i]];
  saveNow();
  renderCards(name);
}

/* ---------- Companies ---------- */
let coFilter = 'all';
let coQuery = '';
let freshCo = null;          // a just-added company stays on top until the next full render
const openCos = new Set();   // cards expanded for editing

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const nextRound = co => co.rounds.find(r => !r.done);

// "2026-11-08T14:00" → { date: 'Sun, 8 Nov', time: '2:00 pm', rel: 'in 2 days', diff, ts }
function when(at) {
  if (!at) return null;
  const d = new Date(at.includes('T') ? at : at + 'T00:00');
  if (isNaN(d)) return null;
  const diff = daysBetween(currentDay, dayKey(d));
  const rel = diff === 0 ? 'today' : diff === 1 ? 'tomorrow' : diff === -1 ? 'yesterday'
    : diff > 0 ? `in ${diff} days` : `${-diff} days ago`;
  return {
    date: d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }),
    time: at.includes('T') ? d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : '',
    rel, diff, ts: d.getTime(),
  };
}
const whenCls = w => (w.diff < 0 ? 'late' : w.diff <= 1 ? 'soon' : '');

function coKey(co) {
  const r = nextRound(co);
  const w = r && when(r.at);
  return [co.id === freshCo ? -1 : GROUP[co.status], RANK[co.priority], w ? w.ts : Infinity, co.name.toLowerCase()];
}
function cmpCo(a, b) {
  const ka = coKey(a), kb = coKey(b);
  for (let i = 0; i < ka.length; i++) {
    if (ka[i] < kb[i]) return -1;
    if (ka[i] > kb[i]) return 1;
  }
  return 0;
}

function renderCompanies() {
  renderCoTop();
  renderCoList();
}

// Counts + "Coming up" (every dated round not done yet, soonest first) + companies waiting for a date
function renderCoTop() {
  const cos = state.companies;
  const count = s => cos.filter(c => c.status === s).length;
  const live = count('applied') + count('wish');
  document.getElementById('coStats').innerHTML =
    `<span class="pill p-co">🏢 <b>${cos.length}</b> ${cos.length === 1 ? 'company' : 'companies'}</span>` +
    `<span class="pill p-day">⏳ <b>${live}</b> in process</span>` +
    `<span class="pill p-offer">🎉 <b>${count('offer')}</b> ${count('offer') === 1 ? 'offer' : 'offers'}</span>` +
    `<span class="pill p-out">✕ <b>${count('out')}</b> out</span>`;

  const up = [];
  const waiting = [];
  for (const co of cos) {
    if (co.status !== 'applied') continue;
    const nr = nextRound(co);
    if (nr && !nr.at) waiting.push(co);
    for (const r of co.rounds) {
      const w = !r.done && when(r.at);
      if (w) up.push({ co, r, w });
    }
  }
  up.sort((a, b) => a.w.ts - b.w.ts);

  const box = document.getElementById('coUpcoming');
  box.replaceChildren();
  box.hidden = !up.length && !waiting.length;
  if (box.hidden) return;
  box.append(el('div', 'upc-h', '📌 Coming up'));
  for (const { co, r, w } of up) {
    const row = el('button', 'upc-row');
    row.innerHTML =
      `<span class="upc-when ${whenCls(w)}">${esc(w.date)}<small>${esc(w.time)}${w.time ? ' · ' : ''}${esc(w.rel)}</small></span>` +
      `<span class="upc-what"><b>${esc(co.name || 'Unnamed company')}</b> — ${esc(r.name || 'Round')}` +
      (w.diff < 0 ? `<small>Date passed — tick it once it's done</small>` : co.role || co.code ? `<small>${esc([co.role, co.code].filter(Boolean).join(' · '))}</small>` : '') +
      `</span>`;
    row.addEventListener('click', () => openCo(co.id));
    box.append(row);
  }
  if (waiting.length) {
    const w = el('div', 'upc-wait', 'Date not out yet: ');
    for (const co of waiting) {
      const b = el('button', '', co.name || 'Unnamed');
      b.addEventListener('click', () => openCo(co.id));
      w.append(b);
    }
    box.append(w);
  }
}

function renderCoList() {
  document.querySelectorAll('#coFilters button').forEach(b => b.classList.toggle('on', b.dataset.f === coFilter));
  const q = coQuery.trim().toLowerCase();
  const list = state.companies.filter(co => {
    if (coFilter === 'active' && co.status !== 'applied' && co.status !== 'wish') return false;
    if (coFilter === 'high' && co.priority !== 'high') return false;
    if ((coFilter === 'offer' || coFilter === 'out') && co.status !== coFilter) return false;
    if (q && ![co.name, co.role, co.code].some(v => v.toLowerCase().includes(q))) return false;
    return true;
  }).sort(cmpCo);
  const box = document.getElementById('coList');
  box.replaceChildren();
  if (!list.length) {
    box.append(el('div', 'empty', state.companies.length
      ? 'No companies match.'
      : 'No companies yet. Tap “+ Add company” each time you fill an application.'));
  }
  list.forEach(co => box.append(coCard(co)));
}

function openCo(id) {
  openCos.add(id);
  coFilter = 'all';
  coQuery = '';
  document.getElementById('coSearch').value = '';
  renderCoList();
  const card = document.querySelector(`.co[data-id="${id}"]`);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function coCard(co) {
  const card = el('article', 'card co');
  card.dataset.id = co.id;
  const sum = el('div', 'co-summary');
  sum.tabIndex = 0;
  sum.setAttribute('role', 'button');
  const toggle = () => {
    if (openCos.has(co.id)) openCos.delete(co.id); else openCos.add(co.id);
    renderCoEdit(card, co);
  };
  sum.addEventListener('click', toggle);
  sum.addEventListener('keydown', e => {
    if (e.target === sum && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(); }
  });
  card.append(sum);
  fillSummary(card, co);
  renderCoEdit(card, co);
  return card;
}

function fillSummary(card, co) {
  const p = PRIORITY[co.priority];
  const s = STATUS[co.status];
  card.style.setProperty('--c', p.c);
  card.classList.toggle('out', co.status === 'out');

  const nr = nextRound(co);
  const done = co.rounds.filter(r => r.done).length;
  const dots = co.rounds.map(r => {
    const cls = r.done ? 'd' : r === nr ? (co.status === 'out' ? 'x' : 'n') : '';
    return `<i class="${cls}" title="${esc(r.name || 'Round')}"></i>`;
  }).join('');
  const applied = when(co.appliedOn);
  const sub = [co.role, co.code && 'Code ' + co.code, applied && 'Applied ' + applied.date].filter(Boolean);

  let next;
  if (co.status === 'out') next = `<span class="late">Out${nr ? ' at ' + esc(nr.name || 'a round') : ''}</span>`;
  else if (co.status === 'offer') next = '<span style="color:#2b8a3e;font-weight:600">Offer received</span>';
  else if (!co.rounds.length) next = '<span class="muted">Open to add this company\'s rounds</span>';
  else if (!nr) next = '<span class="muted">All rounds done — waiting for result</span>';
  else {
    const w = when(nr.at);
    next = `Next: <b>${esc(nr.name || 'Round')}</b> · ` + (w
      ? `<span class="${whenCls(w)}">${esc(w.date)}${w.time ? ', ' + esc(w.time) : ''} · ${esc(w.rel)}</span>`
      : '<span class="muted">date not out yet</span>');
  }

  card.querySelector('.co-summary').innerHTML =
    `<div class="co-top"><span class="co-name">${co.name ? esc(co.name) : '<span class="muted">New company</span>'}</span>` +
    `<span class="badge" style="background:${p.t};color:${p.i}">${p.label}</span><span class="chev">▾</span></div>` +
    (sub.length ? `<div class="co-sub">${esc(sub.join(' · '))}</div>` : '') +
    `<div class="co-prog"><span class="badge" style="background:${s.t};color:${s.i}">${s.label}</span>` +
    (co.rounds.length ? `<span class="dots">${dots}</span><span class="muted">${done}/${co.rounds.length} rounds</span>` : '') +
    `</div><div class="co-next">${next}</div>`;
}

function seg(label, options, value, onPick) {
  const wrap = el('div', 'fld wide');
  wrap.append(el('span', 'fld-l', label));
  const row = el('div', 'seg');
  for (const [k, text] of options) {
    const b = el('button', k === value ? 'on' : '', text);
    b.type = 'button';
    b.addEventListener('click', () => {
      row.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      onPick(k);
    });
    row.append(b);
  }
  wrap.append(row);
  return wrap;
}

function renderCoEdit(card, co) {
  const old = card.querySelector('.co-edit');
  if (old) old.remove();
  const open = openCos.has(co.id);
  card.classList.toggle('open', open);
  card.querySelector('.co-summary').setAttribute('aria-expanded', open);
  if (!open) return;

  const changed = () => { save(); fillSummary(card, co); renderCoTop(); };
  const ed = el('div', 'co-edit');

  const field = (label, key, type, placeholder) => {
    const wrap = el('label', 'fld');
    wrap.append(el('span', 'fld-l', label));
    const inp = document.createElement('input');
    inp.type = type;
    inp.value = co[key];
    if (placeholder) inp.placeholder = placeholder;
    inp.addEventListener('input', () => { co[key] = inp.value; changed(); });
    wrap.append(inp);
    return wrap;
  };
  const grid = el('div', 'co-fields');
  const nameF = field('Company', 'name', 'text', 'e.g. Google');
  nameF.classList.add('wide');
  grid.append(
    nameF,
    field('Role', 'role', 'text', 'e.g. SDE'),
    field('Job code', 'code', 'text', 'e.g. JC-1042'),
    seg('Priority', [['high', 'High'], ['med', 'Medium'], ['low', 'Low']], co.priority, k => { co.priority = k; changed(); }),
    seg('Status', Object.entries(STATUS).map(([k, v]) => [k, v.short]), co.status, k => {
      co.status = k;
      if (k === 'applied' && !co.appliedOn) co.appliedOn = currentDay;
      changed();
    }),
    field('Applied on', 'appliedOn', 'date'),
  );
  grid.lastChild.classList.add('wide');

  // Rounds: any process, in order; tick each one when done
  const roundsHead = el('span', 'fld-l rnd-h', 'Process — tick each round once it\'s done');
  const rl = el('div', 'rnds');
  const drawRounds = () => {
    rl.replaceChildren();
    if (!co.rounds.length) rl.append(el('div', 'empty', 'No rounds yet. Add the ones this company has.'));
    co.rounds.forEach((r, i) => {
      const row = el('div', 'rnd' + (r.done ? ' done' : ''));
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = r.done;
      cb.setAttribute('aria-label', 'Done');
      cb.addEventListener('change', () => { r.done = cb.checked; row.classList.toggle('done', r.done); changed(); });
      const nm = el('input', 'rnd-name');
      nm.value = r.name;
      nm.placeholder = 'Round name';
      nm.addEventListener('input', () => { r.name = nm.value; changed(); });
      const acts = el('div', 'rnd-acts');
      const upB = button('↑', 'Move up', () => {
        [co.rounds[i - 1], co.rounds[i]] = [co.rounds[i], co.rounds[i - 1]];
        changed();
        drawRounds();
      });
      if (i === 0) upB.style.visibility = 'hidden';
      const delB = button('✕', 'Remove round', () => {
        if ((r.name || r.at) && !confirm(`Remove "${r.name || 'this round'}"?`)) return;
        co.rounds.splice(i, 1);
        changed();
        drawRounds();
      });
      acts.append(upB, delB);
      const whenBox = el('div', 'rnd-when');
      const at = document.createElement('input');
      at.type = 'datetime-local';
      at.value = r.at;
      at.setAttribute('aria-label', 'Date and time');
      const note = el('small');
      const setNote = () => { note.textContent = r.at ? '' : 'Date not out yet — fill it when it comes'; };
      setNote();
      const onAt = () => { r.at = at.value; setNote(); changed(); };
      at.addEventListener('input', onAt);
      at.addEventListener('change', onAt);
      whenBox.append(at, note);
      row.append(cb, nm, acts, whenBox);
      rl.append(row);
    });
  };
  drawRounds();

  const adds = el('div', 'rnd-adds');
  const addRound = name => {
    co.rounds.push({ id: uid(), name, at: '', done: false });
    changed();
    drawRounds();
    if (!name) rl.querySelector('.rnd:last-child .rnd-name').focus();
  };
  for (const p of ROUND_PRESETS) adds.append(button('+ ' + p, 'Add ' + p, () => addRound(p)));
  adds.append(button('+ Other', 'Add another round', () => addRound('')));

  const notesL = el('span', 'fld-l rnd-h', 'Notes');
  const notes = el('textarea');
  notes.rows = 2;
  notes.placeholder = 'Eligibility, CTC, location, questions asked, links…';
  notes.value = co.notes;
  bindArea(notes, v => { co.notes = v; });

  const del = button('Delete company', 'Delete company', () => {
    if (!confirm(`Delete "${co.name || 'this company'}" and all its rounds?`)) return;
    state.companies = state.companies.filter(c => c !== co);
    openCos.delete(co.id);
    saveNow();
    renderCompanies();
  });
  del.classList.add('co-del');

  ed.append(grid, roundsHead, rl, adds, notesL, notes, del);
  card.append(ed);
  sizeAll(ed);
}

document.getElementById('addCo').addEventListener('click', () => {
  const co = normCompany({ appliedOn: currentDay, rounds: [{ name: 'OA' }] });
  state.companies.push(co);
  freshCo = co.id;
  openCos.add(co.id);
  coFilter = 'all';
  coQuery = '';
  document.getElementById('coSearch').value = '';
  saveNow();
  renderCompanies();
  document.querySelector(`.co[data-id="${co.id}"] .co-edit input`).focus();
});
document.getElementById('coSearch').addEventListener('input', e => { coQuery = e.target.value; renderCoList(); });
document.querySelectorAll('#coFilters button').forEach(b => b.addEventListener('click', () => {
  coFilter = b.dataset.f;
  freshCo = null;
  renderCoList();
}));

/* ---------- Backup ---------- */
function renderBackupAge() {
  const el = document.getElementById('backupAge');
  if (!state.lastBackup) {
    el.textContent = 'Never backed up';
    el.classList.add('old');
    return;
  }
  const d = daysBetween(state.lastBackup, currentDay);
  el.textContent = 'Last backup: ' + (d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago');
  el.classList.toggle('old', d > 7);
}

document.getElementById('exportBtn').addEventListener('click', () => {
  state.lastBackup = currentDay;
  saveNow();
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `my-path-backup-${currentDay}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  renderBackupAge();
});

document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || typeof data.notes !== 'object') throw new Error();
    if (!confirm('Replace everything here with this backup?')) return;
    state = normalize(data);
    saveNow();
    renderAll();
  } catch {
    alert('That file is not a valid backup.');
  }
});

/* ---------- Tabs ---------- */
function showTab(tab) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('section').forEach(s => { s.hidden = s.id !== 'tab-' + tab; });
  try { localStorage.setItem(TAB_KEY, tab); } catch {}
  sizeAll(document.getElementById('tab-' + tab));
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

document.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
  const name = b.dataset.add;
  state[name].push({ id: uid(), title: '', meta: '', body: '' });
  saveNow();
  renderCards(name);
  const titles = document.querySelectorAll(`#${name}List .card-title`);
  titles[titles.length - 1].focus();
}));

document.querySelectorAll('[data-reset]').forEach(b => b.addEventListener('click', () => {
  const name = b.dataset.reset;
  if (!confirm('Replace your edits on this tab with the suggested version?')) return;
  state[name] = withIds(name === 'path' ? DEFAULT_PATH : DEFAULT_CAREERS);
  saveNow();
  renderCards(name);
}));

/* ---------- Wiring ---------- */
const goal = document.getElementById('goal');
bindArea(goal, v => { state.goal = v; });
bindArea(document.getElementById('today'), v => { setNote(currentDay, v); renderStats(); });

function renderAll() {
  goal.value = state.goal;
  renderStats();
  renderNotes();
  renderCards('path');
  renderCards('careers');
  renderCompanies();
  renderBackupAge();
  sizeAll();
}

// If the page stays open past midnight, roll over to the new day
function checkDay() {
  if (dayKey() !== currentDay) {
    saveNow();
    currentDay = dayKey();
    renderAll();
  }
}
document.addEventListener('visibilitychange', checkDay);
window.addEventListener('focus', checkDay);
setInterval(checkDay, 60000);
window.addEventListener('resize', () => sizeAll());
window.addEventListener('beforeunload', () => { if (saveTimer) saveNow(); });

renderAll();
let startTab = 'notes';
try { startTab = localStorage.getItem(TAB_KEY) || 'notes'; } catch {}
showTab(['notes', 'path', 'careers', 'companies'].includes(startTab) ? startTab : 'notes');
try { if (!localStorage.getItem(KEY)) saveNow(); } catch {}

/* ---------- Install pop-up ----------
   Chrome fires beforeinstallprompt only in the browser, never inside the
   installed app, so the pop-up shows on the website alone.
   "Not now" keeps it away for the rest of that browser session. */
const ASKED_KEY = 'my-path.installAsked';
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const ipop = document.getElementById('ipop');
let installEvt = null;

function showInstall() {
  ipop.hidden = false;
  setTimeout(() => ipop.classList.add('open'), 30);
}
function hideInstall() {
  ipop.classList.remove('open');
  setTimeout(() => { ipop.hidden = true; }, 320);
  try { sessionStorage.setItem(ASKED_KEY, '1'); } catch {}
}
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  installEvt = e;
  let asked = false;
  try { asked = sessionStorage.getItem(ASKED_KEY) === '1'; } catch {}
  if (!standalone && !asked) setTimeout(showInstall, 700);
});
document.getElementById('ipYes').addEventListener('click', async () => {
  hideInstall();
  if (!installEvt) return;
  installEvt.prompt();
  await installEvt.userChoice.catch(() => {});
  installEvt = null;
});
document.getElementById('ipNo').addEventListener('click', hideInstall);
ipop.addEventListener('click', e => { if (e.target === ipop) hideInstall(); });
window.addEventListener('appinstalled', () => { hideInstall(); toast('Installed'); });

// Offline + installable when served over http(s); opening the file directly still works without it
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
